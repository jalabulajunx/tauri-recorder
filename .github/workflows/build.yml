name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install opus via chocolatey
        run: choco install opus -y
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Install dependencies
        run: npm install
      
      - name: Build release (MSI)
        run: npm run tauri build -- --bundles msi

      - name: Build release (NSIS)
        run: npm run tauri build -- --bundles nsis

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: teams-audio-recorder-msi
          path: src-tauri/target/release/bundle/msi/*.msi
      
      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: teams-audio-recorder-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
      
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: teams-audio-recorder-portable
          path: src-tauri/target/release/teams-audio-recorder.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: teams-audio-recorder-msi
          path: ./artifacts/msi
      
      - name: Download NSIS artifact
        uses: actions/download-artifact@v4
        with:
          name: teams-audio-recorder-nsis
          path: ./artifacts/nsis
      
      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: teams-audio-recorder-portable
          path: ./artifacts/portable
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/msi/*.msi
            ./artifacts/nsis/*.exe
            ./artifacts/portable/*.exe
          generate_release_notes: true
